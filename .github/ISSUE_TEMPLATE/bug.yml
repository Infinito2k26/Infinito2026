name: Bug
description: Report broken behavior or a regression.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: What is happening now?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Steps
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, URLs, request IDs, or failing tests.
    validations:
      required: false

