services:
  postgres:
    image: postgres:16-alpine
    container_name: infinito_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: infinito_dev_pwd
      POSTGRES_DB: infinito_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infinito_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infinito_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infinito_redis_dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - infinito_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  infinito_network:
    driver: bridge